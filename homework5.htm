<!doctype html>
	<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Do not Go into that good night</title>
	</head>
	<body>
		<header>
			<h1>Do not Go ? into that good night</h1>
		</header>
		<main>
			<script>
			/*<![CDATA[*/
			var action=prompt("How should you not approach the night?", "gentle");
			var type=prompt("What is the night?", "good");
			var burn=prompt("What should burn at the sun?", "Old Age");
			var rage=prompt ("What should you do against the sun?", "Rage");
			var wise=prompt("What type of men know the dark is cool?","wise");
			var crying=prompt("What type of men are crying?","Good");
			var wild=prompt("What type of men raced the sun?", "Wild");
			var wild2=prompt("What did they do as the sun left?","grieved");
			var eyes=prompt("What type of eyes can blaze like meteors?","Blind");
			var relations=prompt("How are you related to the man?","father");
			var bless=prompt("What is he blessing you with?","tears");
			
			document.writeln("Do not go " + action + " into that " + type + " night." + "<br>");
			document.writeln(burn + " should burn and rave at close of day;" + "<br>");
			document.writeln(rage + ", " + rage + " against the dying of the light." + "<br>" + "<br>");
			
			document.writeln("Though " + wise + " men at their end know dark is right," + "<br>");
			document.writeln("Because their words had forked no lightning they" + "<br>");
			document.writeln("Do not go " + action + " into that " + type + " night." + "<br>" + "<br>");
			
			document.writeln(crying + " men, the last wave by, crying how bright" + "<br>");
			document.writeln("Their frail deeds might have danced in a green bay" + "<br>");
			document.writeln(rage + ", " + rage + " against the dying of the light." + "<br>" + "<br>");
			
			document.writeln(wild + " men who caught and sang the sun in flight," + "<br>");
			document.writeln("And learn, too late, they " + wild2 + " it on its way," + "<br>");
			document.writeln("Do not go " + action + " into that " + type + " night." + "<br>" + "<br>");
			
			document.writeln("Grave men, near death, who see with blinding sight" + "<br>");
			document.writeln(eyes + " eyes could blaze like meteors and be gay,"  + "<br>");
			document.writeln(rage + ", " + rage + " against the dying of the light." + "<br>" + "<br>");
			
			document.writeln("And you, my " + relations + ", there on the sad height" + "<br>");
			document.writeln("Curse, bless, me now with your fierce " + bless + ", I pray." + "<br>");
			document.writeln("Do not go " + action + " into that " + type + " night." + "<br>");
			document.writeln(rage + ", " + rage + " against the dying of the light." + "<br>");
			/*]]>*/
			</script>
		</main>

			</p>
		</footer>
	</body>
</html>
